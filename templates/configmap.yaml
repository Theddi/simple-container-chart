{{- if .Values.configs }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simple-container.fullname" . }}-config
  labels:
    {{- include "simple-container.labels" . | nindent 4 }}
data:
  {{- range .Values.configs }}
  {{ .name | quote }}: |
    {{- required "each configs entry needs a content" .content | trimSuffix "\n" | nindent 4 }}
  {{- end }}
{{- end }}
